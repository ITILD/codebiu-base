# Alembic 配置(REQ-008 数据库迁移机制)
# 连接串不在此配置: alembic/env.py 从主服务三级配置(config.yaml → 环境层 → CODEBIU_* 环境变量)
# 解析 db_rel 节, 与主服务始终同库; 所有 alembic 命令需在 server_py 目录下执行
[alembic]
script_location = alembic
prepend_sys_path = .
# 迁移文件命名: 版本号_含义slug
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
