# ==============================================================================
# 主服务 HTTP 配置（默认）
# server_name 的 __SERVER_NAME__ 由 build.sh 用 deploy.env 的 DOMAIN 替换
# 需要 HTTPS 时改用同目录的 nginx.https.conf
# ==============================================================================
server {
    listen       80;
    listen  [::]:80;
    server_name  __SERVER_NAME__;

    root /usr/share/nginx/html/index;
    index index.html;

    client_header_timeout 30s;

    # Let's Encrypt / certbot 域名校验（HTTP-01）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 前端单页应用
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（服务名 server，容器内 6666）
    location /base_server/ {
        client_max_body_size 100m;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        client_body_timeout   300s;

        proxy_pass http://server:6666/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
