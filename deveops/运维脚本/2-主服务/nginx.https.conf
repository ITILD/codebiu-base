# ==============================================================================
# 主服务 HTTPS 配置
# 启用方式：2-主服务/server_0/deploy.env 里 ENABLE_HTTPS=1，并填写 DOMAIN
# 证书放置：$DEPLOY_DIR/nginx/certs/fullchain.pem 与 privkey.pem
#   （compose 会挂载到容器内 /etc/nginx/certs，只读）
# 申请证书：把 nginx/www 作为 webroot 给 certbot，签完把两个 pem 拷到 certs/
# ==============================================================================

# ---------------- HTTP：只做 ACME 校验，其余 301 到 HTTPS ----------------
server {
    listen       80;
    listen  [::]:80;
    server_name  __SERVER_NAME__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------- HTTPS：前端 + API ----------------
server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2        on;
    server_name  __SERVER_NAME__;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    # 确认全站 HTTPS 无误后再开启 HSTS；开启后回退 HTTP 会较麻烦
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html/index;
    index index.html;

    client_header_timeout 30s;

    # 前端单页应用
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 站点静态配置(备案号/版权等): 发布后直接改此文件即可, 禁止缓存
    location = /app-config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 后端 API 反向代理（服务名 server，容器内 6666）
    location /base_server/ {
        client_max_body_size 100m;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        client_body_timeout   300s;

        proxy_pass http://server:6666/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
