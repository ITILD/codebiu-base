# 部署目录 compose 模板(由 build 脚本复制到 $DEPLOY_DIR, 变量读同目录 .env)
# 外挂策略: 镜像只含 python 环境与依赖, 代码/配置/数据全部 volume 外挂
#   => 更新代码: 替换 $DEPLOY_DIR/server_py/src 后 ./ctl.sh restart 即生效
services:
  nginx:
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/conf/conf.d:/etc/nginx/conf.d
      - ./nginx/download:/usr/share/nginx/download
    environment:
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server_py
    restart: unless-stopped

  postgres:
    # 可选本地中间件: 默认不启(应用直连远程库); 开启: deploy.env 里 ENABLE_PG=1
    profiles: ["pg"]
    container_name: ${COMPOSE_PROJECT_NAME}-db
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codebiu}
      POSTGRES_USER: ${POSTGRES_USER:-codebiu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codebiu123}
      TZ: Asia/Shanghai
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "${PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codebiu} -d ${POSTGRES_DB:-codebiu}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis7:
    # 可选本地中间件: 默认不启(应用直连远程库); 开启: deploy.env 里 ENABLE_REDIS=1
    profiles: ["redis"]
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    image: redis:7.2.4
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: "redis-server /etc/redis/redis.conf --appendonly yes"
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
    restart: always

  server_py:
    image: ${SERVER_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-server
    ports:
      # 应用监听 6666(config.yaml server.port, dev 层不覆盖), 宿主端口由 SERVER_PORT 控制
      - "${SERVER_PORT:-3001}:6666"
    volumes:
      # ---- 外挂的可变内容(更新=改这里+restart, 无需重建镜像) ----
      - ./server_py/src:/app/src
      - ./server_py/public:/app/public
      - ./server_py/config.yaml:/app/config.yaml
      - ./server_py/config.dev.yaml:/app/config.dev.yaml
      - ./server_py/rbac_model.conf:/app/rbac_model.conf
      # ---- 运行时目录 ----
      - ./server_py/log:/app/log
      - ./server_py/temp:/app/temp
      - ./server_py/temp_source:/app/temp_source
    environment:
      - TZ=Asia/Shanghai
      # 加载 config.dev.yaml(远程 PG/Redis/Milvus 等), 否则用基线配置连 localhost
      - APP_ENV=dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 不依赖本地 pg/redis(应用直连远程; 且 depends_on 会强制激活可选 profile)
    restart: always
