# ==============================================================================
# 任务队列（部署目录模板，由 3-任务队列/build.sh 复制到 $DEPLOY_DIR）
# 只跑 worker / beat / 宿主机探针，不含前端与主服务
# 依赖（Redis/PostgreSQL/Milvus/RustFS）来自 1-依赖环境，通过 config.dev.yaml 连接
# 部署目录最终只有：ctl.sh  docker-compose.yml  .env  app/
# ==============================================================================

name: ${COMPOSE_PROJECT_NAME:-codebiu-task}

x-app-volumes: &app-volumes
  - ./app/src:/app/src
  - ./app/public:/app/public
  - ./app/config.yaml:/app/config.yaml
  - ./app/config.dev.yaml:/app/config.dev.yaml
  - ./app/rbac_model.conf:/app/rbac_model.conf
  - ./app/alembic.ini:/app/alembic.ini
  - ./app/alembic:/app/alembic
  - ./app/temp_source:/app/temp_source
  - ./app/log:/app/log

services:
  # 任务执行器：副本数 = 容器数，单容器并发 = TASK_CONCURRENCY
  # 不设 container_name，才能多副本；ctl.sh scale 可临时扩缩容
  task_worker:
    image: ${TASK_IMAGE}
    command: [".venv/bin/python", "src/app_task.py"]
    volumes: *app-volumes
    environment:
      - TZ=Asia/Shanghai
      - MALLOC_ARENA_MAX=2
      - TASK_QUEUES=${TASK_QUEUES}
      - TASK_POOL=${TASK_POOL}
      - TASK_CONCURRENCY=${TASK_CONCURRENCY}
      - TASK_REAPER=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      replicas: ${TASK_REPLICAS:-2}

  # 周期调度触发进程：全局单实例（多台任务机时只在一台启动）
  task_beat:
    image: ${TASK_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-beat
    command: [".venv/bin/python", "src/app_task.py"]
    volumes: *app-volumes
    environment:
      - TZ=Asia/Shanghai
      - MALLOC_ARENA_MAX=2
      - TASK_ROLE=beat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 宿主机运维探针：主服务经它查看/伸缩本机 task_worker 容器
  # 如不需要远程伸缩，可在 .env 里把 HOST_PROBE_PORT 留空并注释本服务
  host_probe:
    image: ${TASK_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-host-probe
    command: [".venv/bin/python", "src/app_host_probe.py"]
    volumes:
      - ./app/src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
      - MALLOC_ARENA_MAX=2
      - AGENT_PORT=8700
      - AGENT_TOKEN=${HOST_PROBE_TOKEN}
    ports:
      - "${HOST_PROBE_PORT:-8700}:8700"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
